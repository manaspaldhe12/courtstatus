name: Supabase keep-alive

# Free Supabase projects auto-pause after 7 days with no activity. A weekly
# authenticated read keeps the project active with zero added infra.
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ vars.SUPABASE_URL }}/rest/v1/locations?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -o /dev/null
